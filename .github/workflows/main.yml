name: CI - tests, lint and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insta-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Java 17 / Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle restores the wrapper, dependencies, Gradle user-home state and
      # local task-output build cache. Do not also enable setup-java's Gradle cache:
      # it duplicates work and produces competing cache writes.
      - name: Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Ensure only required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -d "$ANDROID_HOME/platforms/android-34" || ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            yes | "$SDK" --licenses >/dev/null || true
            "$SDK" 'platforms;android-34' 'build-tools;35.0.0'
          fi

      - name: Unit tests, Android lint and build (no unsigned APK publication)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --build-cache --parallel --max-workers=3 \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Ensure debug package was built
        shell: bash
        run: test -s app/build/outputs/apk/debug/app-debug.apk

# No APK is uploaded by CI. The separate Build APK workflow exclusively publishes
# verified, signed APKs with 1-day Actions artifact retention.
